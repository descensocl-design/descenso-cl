<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Imágenes editoriales | Descenso.cl</title><style>body{background:#0b0b0b;color:#eee;font:16px Arial,sans-serif;margin:0;padding:32px 18px}main{max-width:820px;margin:auto}h1{font-size:30px}p{line-height:1.5;color:#bbb}input,button{font:inherit;padding:12px;margin:8px 0}input[type=password]{width:100%;box-sizing:border-box;background:#171717;color:#fff;border:1px solid #555}button{background:#dfff38;color:#111;border:0;font-weight:800;cursor:pointer}button:disabled{opacity:.5}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px}figure{margin:0}img{width:100%;height:180px;object-fit:cover}figcaption{font-size:12px;color:#bbb}#status{white-space:pre-wrap}</style></head><body><main><h1>DESCENSO.CL / IMÁGENES EDITORIALES</h1><p>Sube hasta 12 fotografías de una noticia. Se optimizan y guardan en Cloudflare D1, sin utilizar GitHub. Requiere la clave de administración. Las imágenes no se publican automáticamente en una noticia: primero deben enlazarse desde su artículo.</p><label>Clave de administración<input type="password" id="token" autocomplete="off"></label><label>Identificador de noticia<input id="article" value="lanco-tour-dh-cup-2026"></label><label>Seleccionar fotos<input type="file" id="photos" accept="image/jpeg,image/png,image/webp" multiple></label><button id="send">SUBIR FOTOGRAFÍAS</button><p id="status" role="status"></p><div id="gallery"></div><script>const $=id=>document.getElementById(id);async function convert(file){const bitmap=await createImageBitmap(file);const scale=Math.min(1,1200/bitmap.width,1000/bitmap.height);const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();let q=.8,blob;do{blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',q));q-=.1}while(blob&&blob.size>480000&&q>=.3);if(!blob||blob.size>500000)throw Error('Imagen demasiado grande');return await new Promise((resolve,reject)=>{const r=new FileReader;r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(blob)});} $('send').onclick=async()=>{const files=[...$('photos').files],id=$('article').value.trim(),token=$('token').value;if(!/^[a-z0-9][a-z0-9-]{2,100}$/.test(id)||!token||!files.length){$('status').textContent='Ingresa clave, identificador y fotografías';return}if(files.length>12){$('status').textContent='Máximo 12 fotografías';return} $('send').disabled=true;$('gallery').replaceChildren();try{for(let i=0;i<files.length;i++){ $('status').textContent='Subiendo '+(i+1)+' de '+files.length+'…';const jpeg=await convert(files[i]);const r=await fetch('/api/editorial-image',{method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:JSON.stringify({id,slot:i+1,jpeg})});const data=await r.json();if(!r.ok)throw Error(data.error||'Error de subida');const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');img.src=data.url;caption.textContent='Foto '+(i+1)+' · '+files[i].name;figure.append(img,caption);$('gallery').append(figure)}$('status').textContent='Listo: '+files.length+' fotografías almacenadas en Cloudflare.'}catch(e){$('status').textContent='Error: '+e.message}finally{$('send').disabled=false}};</script></main></body></html>
