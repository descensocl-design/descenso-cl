name: Preparar borradores editoriales (prueba)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  borradores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/borradores-editoriales
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recopilar fuentes editoriales RSS
        run: python scripts/recolectar_fuentes.py
      - name: Generar artículos originales para revisión (no publica)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/redactar_borradores.py
      - name: Guardar borradores en rama de pruebas
        run: |
          git config user.name "Descenso News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/borradores-ia/
          if ! git diff --cached --quiet; then
            git commit -m "Preparar borradores para revisión editorial"
            git push origin HEAD:feature/borradores-editoriales
          fi
