name: Sincronizar noticias
on:
  push:
    branches: [main]
    paths:
      - 'data/noticias/**'
      - 'data/posts.json'
      - 'data/editorial-overrides.json'
      - 'scripts/generar_paginas.py'
      - 'scripts/auditar_multimedia.py'
      - 'scripts/aplicar_editorial.py'
      - 'scripts/verificar_catalogo.py'
      - 'scripts/completar_fotos_fuente.py'
      - 'scripts/fotos_del_articulo_original.py'
      - 'scripts/auditar_fotos_matthew.py'
      - 'scripts/recuperar_videos_fuente.py'
      - '.github/workflows/sync-news.yml'
  workflow_dispatch:
concurrency:
  group: sync-news-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar lector de metadatos
        run: pip install PyYAML Pillow beautifulsoup4
      - name: Convertir noticias al formato de la portada
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          from datetime import date, datetime
          import yaml

          def plain(value):
              return re.sub(r'\s+', ' ', re.sub(r'[#*_`>\[\]()]', '', value)).strip()

          # Conservar imágenes ya publicadas para evitar regresiones visuales.
          anteriores = json.loads(Path('data/posts.json').read_text(encoding='utf-8')) if Path('data/posts.json').exists() else []
          imagenes_existentes = {(p.get('title'), p.get('date')): p.get('image') for p in anteriores if isinstance(p, dict)}
          posts = []
          for file in sorted(Path('data/noticias').glob('*.md')):
              content = file.read_text(encoding='utf-8-sig')
              match = re.match(r'^---\s*\n(.*?)\n---\s*\n?(.*)$', content, re.S)
              if not match:
                  print(f'Ignorando {file}: sin metadatos')
                  continue
              meta = yaml.safe_load(match.group(1)) or {}
              body = match.group(2).strip()
              paragraphs = [plain(p) for p in re.split(r'\n\s*\n', body) if plain(p)]
              date_value = meta.get('date', '')
              if isinstance(date_value, (datetime, date)):
                  date_value = date_value.isoformat()
              date_value = str(date_value)[:10]
              video = str(meta.get('video') or meta.get('youtube') or '').strip()
              image = str(meta.get('image') or '').strip()
              images = meta.get('images') if isinstance(meta.get('images'), list) else []
              images = [str(url).strip() for url in images if isinstance(url, str) and str(url).startswith('https://')][:12]
              # Las fotos nuevas solo se muestran si han sido autorizadas.
              # Los gráficos locales de Descenso son siempre admisibles.
              image_approved = meta.get('image_approved') is True
              fecha_clave = str(meta.get('date') or '')[:10]
              ya_publicada = imagenes_existentes.get((str(meta.get('title') or file.stem), fecha_clave)) == image
              # Conservar material heredado anterior a esta regla, sin declararlo autorizado.
              heredada = fecha_clave < '2026-11-10'
              if image and not (image_approved or image.startswith('/assets/') or ya_publicada or heredada):
                  print(f'Fotografía sin autorizar en {file}: se usa portada de categoría')
                  image = ''
              posts.append({
                  'title': str(meta.get('title') or file.stem),
                  'date': date_value,
                  'category': str(meta.get('category') or 'Downhill'),
                  'excerpt': str(meta.get('description') or meta.get('excerpt') or (paragraphs[0][:190] if paragraphs else '')),
                  'image': image,
                  'images': images,
                  'image_approved': image_approved,
                  'image_credit': str(meta.get('image_credit') or '').strip(),
                  'youtube': video,
                  'body': paragraphs,
                  'link': str(meta.get('link') or '')
              })
          # Dos archivos con igual título y fecha corresponden a una sola noticia.
          # Conservar una copia sin borrar sus archivos Markdown originales.
          unicos = {}
          for post in posts:
              clave = (post['date'], post['title'].strip().casefold())
              unicos.setdefault(clave, post)
          if len(unicos) != len(posts):
              print(f'Duplicados editoriales omitidos: {len(posts) - len(unicos)}')
          posts = list(unicos.values())
          existing_path = Path('data/posts.json')
          existing = json.loads(existing_path.read_text(encoding='utf-8')) if existing_path.exists() else []
          # Preservar correcciones editoriales aun si cambia el título.
          # Identidad estable de una noticia: fecha + imagen principal.
          prior_by_key = {(str(p.get('date')), str(p.get('title','')).strip().casefold()): p
                          for p in existing if isinstance(p, dict)}
          prior_by_cover = {(str(p.get('date')), str(p.get('image',''))): p
                            for p in existing if isinstance(p, dict) and p.get('image')}
          for manual in posts:
              prior = (prior_by_key.get((str(manual.get('date')), str(manual.get('title','')).strip().casefold()))
                       or prior_by_cover.get((str(manual.get('date')), str(manual.get('image','')))))
              if not prior: continue
              for attr in ('link','source_name','image_source_url','editorial_update','official_video_collection','media_review','permalink','image_credit'):
                  if not manual.get(attr) and prior.get(attr): manual[attr] = prior[attr]
              if prior.get('images') and not manual.get('images'):
                  manual['images'] = prior['images']
              override = prior.get('editorial_override')
              if isinstance(override,dict):
                  for attr in ('title','excerpt','body','category'):
                      if override.get(attr):
                          manual[attr] = override[attr]
                  manual['editorial_override'] = override
              elif prior.get('editorial_update') and prior.get('excerpt'):
                  manual['excerpt'] = prior['excerpt']
          # Conservar noticias automáticas al sincronizar las noticias manuales.
          manual_links = {p.get('link') for p in posts if p.get('link')}
          auto_posts = [p for p in existing if p.get('auto_published') and p.get('link') not in manual_links]
          # Exclusión editorial permanente: no republicar los compilados Friday Fails.
          def contenido_excluido(post):
              url = str(post.get('link') or '').lower()
              title = str(post.get('title') or '').lower()
              return ('pinkbike.com/news/video-friday-fails-' in url
                      or 'friday fails' in title)
          posts = [p for p in posts + auto_posts if not contenido_excluido(p)]
          # Las rectificaciones persistentes prevalecen sobre los markdown
          # y sobre los datos generados anteriormente.
          overrides_path = Path('data/editorial-overrides.json')
          overrides = json.loads(overrides_path.read_text(encoding='utf-8')) if overrides_path.exists() else {}
          for post in posts:
              key = str(post.get('date','')) + '|' + str(post.get('image',''))
              if key in overrides:
                  post.update(overrides[key])

          posts.sort(key=lambda p: p['date'], reverse=True)
          target = Path('data/posts.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(posts, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'{len(posts)} noticias sincronizadas')
          PY
      - name: Recuperar fotos del cuerpo de las publicaciones originales
        run: python scripts/fotos_del_articulo_original.py
      - name: Guardar diagnóstico fotográfico temprano
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f data/diagnostico-fotos.json; then
            git add data/diagnostico-fotos.json
            if ! git diff --cached --quiet; then
              git commit -m "Diagnóstico real de imágenes Pinkbike"
              git push origin HEAD:main
            fi
          fi
      - name: Recuperar fotos desde el RSS de las fuentes originales
        run: python scripts/completar_fotos_fuente.py
      - name: Recuperar reproductores de video originales
        run: python scripts/recuperar_videos_fuente.py
      - name: Aplicar correcciones y galerías verificadas tras las fuentes
        run: python scripts/aplicar_editorial.py
      - name: Verificar que noticias y galerías no retrocedieron
        run: python scripts/verificar_catalogo.py
      - name: Verificar sintaxis de JavaScript y funciones Cloudflare
        run: |
          node --check comments.js
          node --check analytics.js
          node --check article-extras.js
          node --input-type=module --check < "functions/api/comments/[[slug]].js"
          node --input-type=module --check < "functions/api/comment-reports/[[slug]].js"
          node --input-type=module --check < "functions/api/moderation.js"
          node --check admin/moderacion.js
      - name: Generar páginas y sitemap
        run: python scripts/generar_paginas.py
      - name: Auditar multimedia y fuentes de todas las noticias
        run: python scripts/auditar_multimedia.py
      - name: Guardar actualización
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json data/diagnostico-fotos.json data/revision-multimedia.json noticias/ sitemap.xml robots.txt
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar noticias de la portada"
            git push origin HEAD:main
          fi
