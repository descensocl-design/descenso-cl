
name: Probar fuentes oficiales MTB

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analizar fuentes oficiales
        run: python scripts/probar_extraccion_uci.py
