
name: Probar clasificador editorial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar sintaxis
        run: python -m py_compile scripts/clasificar_contenidos.py

      - name: Clasificar contenidos
        run: python scripts/clasificar_contenidos.py

      - name: Mostrar resumen
        run: |
          python - <<'PY'
          import json

          with open("data/contenidos_clasificados.json", encoding="utf-8") as f:
              datos = json.load(f)

          for grupo, total in datos["totales"].items():
              print(f"\n{grupo.upper()}: {total}")
              for noticia in datos[grupo]:
                  print(" -", noticia["titulo"])
          PY

      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: clasificacion-editorial
          path: data/contenidos_clasificados.json
          retention-days: 7
