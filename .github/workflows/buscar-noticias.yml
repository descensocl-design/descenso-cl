name: Buscar y publicar noticias Pinkbike

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buscar-noticias-mtb
  cancel-in-progress: false

jobs:
  buscar-y-publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar noticias de Pinkbike
        run: python scripts/buscar_noticias.py

      - name: Ampliar contexto desde la fuente original
        run: python scripts/ampliar_contexto.py

      - name: Redactar y publicar hasta cinco artículos diarios
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/automatizar_pinkbike.py --publicar

      - name: Generar páginas individuales y sitemap
        run: python scripts/generar_paginas.py

      - name: Guardar candidatas y publicaciones
        shell: bash
        run: |
          git config user.name "Descenso News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/noticias_candidatas.json data/noticias_ampliadas.json data/posts.json noticias/ sitemap.xml robots.txt

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Publicar breves Pinkbike en Descenso.cl"
            git push
          fi
