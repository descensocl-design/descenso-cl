<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Moderación — Descenso.cl</title><link rel="stylesheet" href="/styles.css"><style>main{max-width:800px;margin:45px auto;padding:0 20px}h1{font-size:38px}input{width:100%;padding:13px;color:white;background:#171719;border:1px solid #555}button{padding:10px 16px;border:0;background:#ee272b;color:#fff;font-weight:bold;cursor:pointer;margin:10px 10px 10px 0}article{padding:20px;background:#161616;margin:18px 0;border:1px solid #444}article p{white-space:pre-wrap;line-height:1.6}small{color:#aaa}</style></head><body><main><a href="/">DESCENSO.CL</a><h1>MODERACIÓN DE COMENTARIOS</h1><p>Introduce tu clave privada de moderación. No se guarda en este navegador.</p><input type="password" id="token" autocomplete="off" placeholder="Clave privada de moderación"><button id="load">CARGAR PENDIENTES</button><p id="status"></p><div id="results"></div></main><script>
let key='';const status=document.getElementById('status'),results=document.getElementById('results');
document.getElementById('load').onclick=async()=>{key=document.getElementById('token').value.trim();document.getElementById('token').value='';if(!key){status.textContent='Falta la clave';return}await load()};
async function load(){results.replaceChildren();try{let r=await fetch('/api/comments/admin',{headers:{authorization:'Bearer '+key},cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Error');status.textContent=d.comments.length+' comentarios pendientes';for(const c of d.comments){let a=document.createElement('article'),h=document.createElement('strong'),meta=document.createElement('small'),p=document.createElement('p');h.textContent=c.display_name;meta.textContent=' — '+c.article_slug+' · '+c.created_at;p.textContent=c.message;a.append(h,meta,p);for(const [label,value] of [['APROBAR','approved'],['RECHAZAR','rejected']]){let b=document.createElement('button');b.textContent=label;b.onclick=async()=>{b.disabled=true;let r=await fetch('/api/comments/admin',{method:'POST',headers:{authorization:'Bearer '+key,'content-type':'application/json'},body:JSON.stringify({id:c.id,status:value})});if(r.ok)await load();else{status.textContent='No se pudo moderar';b.disabled=false}};a.append(b)}results.append(a)}}catch(e){status.textContent='No se pudieron cargar comentarios: '+e.message}}
</script></body></html>
